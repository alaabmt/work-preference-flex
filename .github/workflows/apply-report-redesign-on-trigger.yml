name: Apply report redesign on trigger

on:
  push:
    paths:
      - 'REPORT_UPDATE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply report redesign
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/update_participant_report.py
          python /tmp/update_participant_report.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['en.html','ar.html']:
              s=Path(name).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              for i,script in enumerate(scripts):
                  Path(f'/tmp/{name}-{i}.js').write_text(script)
          PY
          for f in /tmp/en.html-*.js /tmp/ar.html-*.js; do node --check "$f"; done
      - name: Commit redesigned report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en.html ar.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Redesign participant report for coaching handoff'
            git push
          fi
