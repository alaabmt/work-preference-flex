name: Rename survey to Your Work Approach Profile

on:
  push:
    paths:
      - '.github/workflows/rename-work-approach-profile.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update English and Arabic survey name
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('en.html'),
              Path('ar.html'),
              Path('index.html'),
              Path('coach.html'),
              Path('manifest.json'),
          ]

          replacements = {
              'Work Preference & Flex': 'Your Work Approach Profile',
              'Work Preference &amp; Flex': 'Your Work Approach Profile',
              'Work Preference Report': 'Your Work Approach Profile',
              'تفضيلات العمل والمرونة': 'ملف أسلوبك في العمل',
              'تقرير تفضيلات العمل': 'ملف أسلوبك في العمل',
          }

          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'no files')
          PY
      - name: Commit updated site name
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en.html ar.html index.html coach.html manifest.json
          git commit -m "Update site name to Your Work Approach Profile"
          git push
