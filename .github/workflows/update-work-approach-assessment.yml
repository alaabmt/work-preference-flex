name: Update Work Approach Assessment naming and intro

on:
  push:
    paths:
      - '.github/workflows/update-work-approach-assessment.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bilingual assessment naming and participant intro
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('en.html'),
              Path('ar.html'),
              Path('index.html'),
              Path('coach.html'),
              Path('manifest.json'),
              Path('item-bank.json'),
          ]

          # Product name: assessment name is distinct from the report name.
          replacements = {
              'Your Work Approach Profile': 'Work Approach Assessment',
              'ملف أسلوبك في العمل': 'تقييم أسلوب العمل',
          }

          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Participant start screen: remove the construct-by-construct explanation
              # and replace it with the concise value proposition agreed for both languages.
              old_notice = "<div class=\"notice warn\">${rtl?'النسخة V17.5 بحثية تجريبية ومبنية على النموذج النظري المحدّث. يستكشف التقييم ثلاث طرق أساسية للتعامل مع مواقف العمل: فهم الموقف، تنظيم العمل، وبدء العمل. ويُعرض التنسيق مع الآخرين بصورة منفصلة، بينما نقرأ أثر السياق من تغير الاختيارات عبر المواقف.':'V17.5 is a research pilot aligned to the updated theoretical model. It explores three core ways of approaching work situations: Understanding the Situation, Structuring the Work, and Starting Action. Working with Others is reported separately, while the effect of context is explored through response shifts across situations.'}</div>"
              new_intro = "<div class=\"grid three\" style=\"margin-top:18px\"><div class=\"report-box\"><h3>${rtl?'ما هو؟':'What is it?'}</h3><p>${rtl?'تقييم يساعدك على فهم الطريقة التي تميل بها إلى التعامل مع مواقف العمل.':'An assessment that helps you understand how you tend to approach work situations.'}</p></div><div class=\"report-box\"><h3>${rtl?'لماذا يهمك؟':'Why does it matter?'}</h3><p>${rtl?'يساعدك على فهم أسلوبك بشكل أوضح، ومعرفة متى يكون مناسبًا، وكيف تتعامل بفعالية أكبر مع أشخاص قد يعملون بطريقة مختلفة عنك.':'It helps you understand your approach more clearly, recognize when it works well, and work more effectively with people who may approach work differently.'}</p></div><div class=\"report-box\"><h3>${rtl?'ماذا ستحصل عليه؟':'What will you get?'}</h3><p>${rtl?'تقرير شخصي يوضح نمطك، وأهم النقاط التي تستحق الانتباه، وما سيتم استكشافه بشكل أعمق في جلسة الكوتشنغ.':'A personal report showing your pattern, key points to notice, and areas to explore further in coaching.'}</p></div></div>"
              text = text.replace(old_notice, new_intro)

              # Landing page: keep the explanation brief and benefit-led, without revealing
              # the assessment constructs before the participant starts.
              old_landing_p = '<p>يستكشف هذا التقييم كيف تميل إلى فهم الموقف، وتنظيم العمل، والبدء بالفعل، وكيف تدخل الآخرين في طريقة العمل، وكيف يتغير اختيارك عندما يتغير الموقف.</p>'
              new_landing_p = '<p>تقييم يساعدك على فهم الطريقة التي تميل بها إلى التعامل مع مواقف العمل.</p><div class="grid two" style="margin-top:18px;text-align:start"><div class="report-box"><h3>لماذا يهمك؟</h3><p>يساعدك على فهم أسلوبك بشكل أوضح، ومعرفة متى يكون مناسبًا، وكيف تتعامل بفعالية أكبر مع أشخاص قد يعملون بطريقة مختلفة عنك.</p></div><div class="report-box"><h3>ماذا ستحصل عليه؟</h3><p>تقرير شخصي يوضح نمطك، وأهم النقاط التي تستحق الانتباه، وما سيتم استكشافه بشكل أعمق في جلسة الكوتشنغ.</p></div></div>'
              text = text.replace(old_landing_p, new_landing_p)

              # Keep the report title distinct from the assessment name if a previous rename
              # touched any report-facing text.
              text = text.replace('Work Approach Assessment Report', 'Your Work Approach Report')
              text = text.replace('تقرير تقييم أسلوب العمل', 'تقرير أسلوبك في العمل')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'no files')
          PY
      - name: Commit website update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en.html ar.html index.html coach.html manifest.json item-bank.json
          git commit -m "Update Work Approach Assessment naming and introduction"
          git push
