<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182844"><title>لوحة الكوتش · V17.1</title><style>
:root{--ink:#172033;--muted:#687487;--line:#dfe6ee;--navy:#182844;--green:#39a56e;--blue:#4f83c2;--gold:#d3a03a;--orange:#e88443;--bg:#f4f7fa;--card:#fff;--danger:#b54747;--ok:#2f7c58;--shadow:0 18px 55px rgba(34,51,78,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}body[dir=ltr]{font-family:"Segoe UI",Arial,sans-serif}.app-shell{width:min(1040px,100%);margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:44px;height:44px;border-radius:14px;background:white;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}.brandmark i{border-radius:5px}.brandmark i:nth-child(1){background:var(--green)}.brandmark i:nth-child(2){background:var(--blue)}.brandmark i:nth-child(3){background:var(--gold)}.brandmark i:nth-child(4){background:var(--orange)}.brand strong{display:block}.brand small{color:var(--muted);display:block}.version{font-size:.72rem;color:var(--muted);border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,38px);box-shadow:var(--shadow)}.hero{text-align:center}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:.3rem 0}.hero p{color:var(--muted);max-width:760px;margin:0 auto 18px}.hero-image{width:min(900px,100%);display:block;margin:24px auto;border-radius:18px}.notice{border:1px solid #d7e1ea;background:#f8fbfd;border-radius:16px;padding:14px 16px;color:#536276;font-size:.9rem}.notice.warn{border-color:#ead8ad;background:#fffaf0}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}label{font-weight:700;font-size:.9rem;display:block;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cfd8e3;border-radius:12px;padding:12px 13px;background:white;color:var(--ink);font:inherit}.help{color:var(--muted);font-size:.78rem;margin-top:4px}.btn{appearance:none;border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--navy);color:white}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px;flex-wrap:wrap}body[dir=rtl] .actions{justify-content:flex-start}.screen{display:none}.screen.active{display:block}.progress-wrap{background:#e8edf3;border-radius:999px;height:8px;overflow:hidden;margin:8px 0 20px}.progress{height:100%;background:var(--navy);width:0;transition:width .25s}.section-kicker{color:var(--muted);font-size:.8rem;font-weight:800}.question-title{font-size:clamp(1.25rem,2.5vw,1.65rem);line-height:1.55;margin:.4rem 0 16px}.option-list{display:grid;gap:12px}.option-button{width:100%;text-align:inherit;border:1px solid #d8e0e8;background:#fff;border-radius:16px;padding:17px 18px;cursor:pointer;font:inherit;color:var(--ink);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:.15s}.option-button:hover{border-color:#aab9c8;transform:translateY(-1px)}.option-button.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(24,40,68,.08)}.rank-badge{flex:0 0 auto;min-width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f0f3f7;color:var(--navy);font-size:.75rem;font-weight:900}.rank-badge.top{background:#eaf3ee;color:#226846}.rank-badge.second{background:#fff5da;color:#82631d}.rank-badge.low{background:#f1f3f6;color:#66707c}.instruction{color:var(--muted);font-size:.87rem;margin-bottom:13px}.mini-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.step-label{font-size:.8rem;color:var(--muted)}.report-head{text-align:center;margin-bottom:25px}.report-head h1{margin-bottom:4px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.score-card{border:1px solid var(--line);border-radius:18px;padding:16px}.score-card .name{font-weight:900}.score-card .value{font-size:1.55rem;font-weight:900;margin:.3rem 0}.bar{height:9px;background:#edf1f4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px}.score-note{color:var(--muted);font-size:.74rem;margin-top:6px}.section-block{margin-top:26px}.section-block h2{font-size:1.25rem;margin-bottom:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;font-size:.82rem}.ranked-needs{display:grid;gap:9px}.need-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 13px}.need-rank{width:32px;height:32px;border-radius:10px;background:#f0f3f7;display:grid;place-items:center;font-weight:900}.flex-table,.coach-table{width:100%;border-collapse:collapse;margin-top:10px;direction:inherit}.flex-table th,.flex-table td,.coach-table th,.coach-table td{border-bottom:1px solid var(--line);padding:10px;text-align:inherit;vertical-align:top}.flex-table th,.coach-table th{font-size:.78rem;color:#566476;background:#f8fafc}.footer-note{color:var(--muted);font-size:.75rem;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}.lang-switch a{color:var(--navy);text-decoration:none;font-size:.78rem;font-weight:800}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#172033;color:white;padding:11px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.error{color:var(--danger);font-size:.82rem;margin-top:8px}.success{color:var(--ok)}.coach-login{max-width:480px;margin:80px auto}.session-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.session-card h3{margin:0 0 4px}.session-meta{color:var(--muted);font-size:.8rem}.tiny{font-size:.72rem;color:var(--muted)}.checkline{display:flex;gap:9px;align-items:flex-start;margin-top:10px}.checkline input{margin-top:5px}.privacy{font-size:.78rem;color:var(--muted)}
@media(max-width:760px){.grid.two,.grid.three,.report-grid{grid-template-columns:1fr}.app-shell{padding:12px}.panel{border-radius:19px;padding:18px}.version{display:none}.topbar{align-items:flex-start}.option-button{padding:15px}.flex-table{font-size:.82rem}}
@media print{body{background:white}.topbar,.actions,.lang-switch,.mini-actions,.toast{display:none!important}.panel{box-shadow:none;border:0;padding:0}.app-shell{width:100%;padding:0}.section-block{break-inside:avoid}.score-card{break-inside:avoid}}
</style></head>
<body dir="rtl"><main class="app-shell"><div class="topbar"><div class="brand"><div class="brandmark"><i></i><i></i><i></i><i></i></div><div><strong>لوحة الكوتش</strong><small>Coach Dashboard · V17.1</small></div></div><span class="version">Local prototype</span></div><section id="coachApp" class="panel coach-login"><h1>دخول الكوتش</h1><p class="privacy">هذه الحماية مناسبة لنموذج GitHub Pages فقط وليست حماية إنتاجية. الكود والـhash قابلان للفحص. في الإنتاج يجب استخدام تسجيل دخول من الخادم وقاعدة بيانات وصلاحيات حقيقية.</p><div class="field"><label>كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password"></div><div id="err" class="error"></div><div class="actions"><button class="btn" id="login">دخول</button></div></section></main><script>
const EXPECTED='8b38d3944f0038d29232884197d28258be5dbf3aebfa07c4351e2c9e3385337a';
async function sha(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const root=document.getElementById('coachApp');document.getElementById('login').onclick=async()=>{if(await sha(document.getElementById('pw').value)===EXPECTED)renderDash();else document.getElementById('err').textContent='كلمة المرور غير صحيحة.'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderDash(){let packets=JSON.parse(localStorage.getItem('wpf_v17_coach_packets')||'[]');root.classList.remove('coach-login');root.innerHTML=`<h1>جلسات محفوظة على هذا الجهاز</h1><div class="notice warn">هذه اللوحة ترى فقط الجلسات التي أُنجزت في المتصفح نفسه. لا توجد مزامنة عبر الأجهزة في GitHub Pages.</div><div class="actions"><button class="btn secondary" id="clear">حذف كل الحزم المحلية</button></div><div id="sessions">${packets.length?packets.map((p,i)=>card(p,i)).join(''):'<p>لا توجد جلسات مكتملة محفوظة.</p>'}</div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(packets[Number(b.dataset.open)]));document.getElementById('clear').onclick=()=>{if(confirm('حذف جميع الحزم المحلية؟')){localStorage.removeItem('wpf_v17_coach_packets');renderDash()}}}
function card(p,i){let sorted=Object.entries(p.scores.core||{}).sort((a,b)=>b[1].index-a[1].index);return `<div class="session-card"><h3>${esc(p.profile.code)} · ${esc(p.profile.occasion)}</h3><div class="session-meta">${esc(p.profile.role||'—')} · ${esc(p.profile.sector||'—')} · ${new Date(p.savedAt).toLocaleString('ar')}</div><div class="tiny">Core: ${sorted.map(([c,v])=>`${c} ${v.index.toFixed(0)}`).join(' · ')} · Social ${p.scores.social.socialN}/${p.scores.social.total} · Flex shifts ${p.scores.flex.shiftCount}/${p.scores.flex.totalPairs}</div><div class="actions"><button class="btn secondary" data-open="${i}">فتح التقرير التحليلي</button></div></div>`}
function detail(p){let names={U:'فهم الموقف',S:'تنظيم العمل',A:'بدء العمل'},needNames={CLARITY:'وضوح الهدف والدور',INFO:'الوصول إلى المعلومات',AUTONOMY:'مساحة لاتخاذ القرار',PARTICIPATION:'المشاركة في القرارات',PACE:'وضوح الأولويات والتوقيت',CHANGE:'فهم التغيير'};let core=Object.entries(p.scores.core).sort((a,b)=>b[1].index-a[1].index);let indicators=Object.entries(p.scores.indicators||{}).sort();let topNeeds=(p.scores.needs.rank||[]).slice(0,3);let rq=p.scores.responseQuality||{};let median=rq.medianLatencyMs?Math.round(rq.medianLatencyMs/1000*10)/10:'—';root.innerHTML=`<div class="actions"><button class="btn secondary" id="backDash">العودة للجلسات</button><button class="btn secondary" onclick="window.print()">طباعة</button></div><h1>تقرير الكوتش · ${esc(p.profile.code)}</h1><div class="notice">هذا التقرير يولد فرضيات للاستكشاف، ولا يثبت سلوكًا أو قدرة. ابدأ دائمًا بمثال عمل حقيقي.</div><div class="section-block"><h2>الملف الأساسي النسبي</h2><table class="coach-table"><thead><tr><th>التوجه</th><th>متوسط الرتبة</th><th>المؤشر النسبي</th></tr></thead><tbody>${core.map(([c,v])=>`<tr><td>${names[c]}</td><td>${v.avgRank.toFixed(2)}</td><td>${v.index.toFixed(0)}</td></tr>`).join('')}</tbody></table><p class="tiny">هذه مؤشرات Ipsative داخل الجلسة وليست معيارية بين الأشخاص.</p></div><div class="section-block"><h2>التنسيق مع الآخرين</h2><p>اختيارات ذات تركيز اجتماعي مباشر: <strong>${p.scores.social.socialN}/${p.scores.social.total}</strong>.</p><table class="coach-table"><thead><tr><th>نوع العملية</th><th>اختيارات اجتماعية</th><th>الإجمالي</th></tr></thead><tbody>${Object.entries(p.scores.social.byProcess||{}).map(([k,v])=>`<tr><td>${{understanding:'فهم',structuring:'تنظيم',action:'بدء عمل'}[k]||k}</td><td>${v.social}</td><td>${v.total}</td></tr>`).join('')}</tbody></table></div><div class="section-block"><h2>احتياجات البيئة الأعلى</h2><div class="ranked-needs">${topNeeds.map(([c,s],i)=>`<div class="need-row"><span class="need-rank">${i+1}</span><strong>${needNames[c]||c}</strong></div>`).join('')}</div></div><div class="section-block"><h2>الاستجابة للسياق</h2><p>تغيّر اختيار التوجه في <strong>${p.scores.flex.shiftCount}/${p.scores.flex.totalPairs}</strong> أزواج سياقية. لا تفسّر الثبات على أنه جمود ولا التغير على أنه كفاءة قبل التحقق من الواقع.</p></div><div class="section-block"><h2>مؤشرات المحتوى — للاستكشاف فقط</h2><table class="coach-table"><thead><tr><th>الرمز</th><th>متوسط الرتبة</th><th>عدد الظهور</th></tr></thead><tbody>${indicators.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${(v.sum/v.n).toFixed(2)}</td><td>${v.n}</td></tr>`).join('')}</tbody></table><p class="tiny">ليست Facet subscales ولا يجوز تفسيرها كدرجات مقننة.</p></div><div class="section-block"><h2>جودة الاستجابة — إشارات مراجعة لا قواعد استبعاد</h2><p>وسيط زمن البند: ${median} ثانية. توزيع موضع الخيار الأعلى في بنود التفضيل: ${(rq.topChoicePresentedPositionCounts||[]).join(' / ')}.</p></div><div class="section-block"><h2>تسلسل الحوار المقترح</h2><div class="notice"><strong>الدليل ← السياق ← المساهمة ← التكلفة/عدم الملاءمة ← الأثر ← المرونة ← تجربة</strong><br>لا تحاول إثبات نتيجة التقييم. حاول اكتشاف الواقع.</div><p><strong>فرضية للاستكشاف:</strong> هل التوجه الأعلى هنا يظهر فعلًا في مواقف العمل المهمة، أم أن السياق الحالي فقط هو الذي رفعه؟</p><p><strong>لا تفترض:</strong> أن الدرجة الأعلى تعني قدرة أعلى، أو أن الدرجة الأقل تعني ضعفًا.</p><p><strong>اسأل:</strong> أعطني موقفًا حديثًا كان عليك فيه أن تفهم، تنظم، أو تبدأ. ماذا فعلت فعلًا؟ ماذا احتاج الموقف؟</p></div>`;document.getElementById('backDash').onclick=renderDash}
</script></body></html>
